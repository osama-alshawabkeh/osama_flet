name: Android APK Builds
on:
  workflow_dispatch:
  push:
    paths:
      - "main.py"
      - "requirements.txt"
      - "expo-app/**"
      - ".github/workflows/android-apk-build.yml"
    branches: [main]

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  build-flet-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Prepare Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.0"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - name: Build Flet APK
        run: flet build apk --org com.osama.benchmarkflet
      - name: Upload Flet APK
        uses: actions/upload-artifact@v4
        with:
          name: flet-benchmark-apk
          path: build/apk/*.apk
          if-no-files-found: error

  build-expo-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: expo-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Prepare Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - run: npm install
      - name: Generate native Android project
        run: npx expo prebuild --platform android --non-interactive
      - name: Build Expo release APK
        working-directory: expo-app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease
      - name: Upload Expo APK
        uses: actions/upload-artifact@v4
        with:
          name: expo-benchmark-apk
          path: expo-app/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
